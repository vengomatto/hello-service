# Replaced by the Setup service workflow, which writes deploy/service.yaml and removes this file.
# This is the only deployment file a team writes. The platform turns it into the namespace, the
# network rules, the deployments, the ingress, the database and the smoke test.
#
# `tag` is the commit SHA of the image CI built; CI rewrites it in a deploy PR. Never edit it by hand.
# `unreleased` means no image has been released yet.
name: hello-service
host: hello-service.localhost
components:
  app:
    image: ghcr.io/vengomatto/hello-service
    tag: unreleased
    port: 80
    path: /
    health: /
database:
  enabled: false
